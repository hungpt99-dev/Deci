name: Bug report
description: Report a reproducible problem with Deci.
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happens today?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal commands / diff fixture / config to reproduce.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Node, OS, commit SHA, provider.
      value: |
        - node -v:
        - OS:
        - Deci commit:
        - Provider (ollama / openai-byok / vscode-lm):
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste redacted output. Remove API keys, tokens, private code.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / security
      options:
        - label: I removed secrets, tokens, and private code from this report.
          required: true
